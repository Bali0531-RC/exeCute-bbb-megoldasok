<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emelkedő számok - ExeCute</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="top-nav">
        <button id="backButton" class="nav-btn">
            <span class="icon">🏠</span>
            <span>Vissza a főoldalra</span>
        </button>
        <h1 class="app-title">Emelkedő számok</h1>
        <button id="themeToggle" class="nav-btn">
            <span class="icon">🌙</span>
        </button>
    </nav>
    
    <div class="main-content">
        <section class="input-section">
                <h2>Számok bekérése</h2>
                <input type="number" id="numberInput" placeholder="Írj be egy pozitív számot">
                <button id="addBtn">Hozzáad</button>
                <button id="resetBtn">Újrakezdés</button>
            </section>

            <section class="numbers-section">
                <h2>Beírt számok:</h2>
                <div id="numbersList"></div>
            </section>

            <section class="result-section">
                <h2>Leghosszabb emelkedő részsorozat:</h2>
                <div id="result"></div>
            </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
